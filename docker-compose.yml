version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: vietdub_backend
    user: "root"
    ports:
      - "8000:7860"
    env_file:
      - ./backend/.env
    volumes:
      # Mount thư mục storage ra ngoài để không bị mất video khi restart container
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vietdub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
